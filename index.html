<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Video Grid</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside id="left">
  <p class="privacy">Your videos stay on your device.</p>
  <label id="drop">
    <input id="file" type="file" accept="video/*,.mov,.mkv,.m4v" multiple hidden>
    <b>Drop videos here</b>
    <span>or click to choose files (MP4, WebM, MOV)</span>
  </label>
  <div class="pair">
    <button id="dupAll">Duplicate All</button>
    <button id="shuffle">Randomize Videos</button>
  </div>
  <div id="list"></div>
</aside>

<main>
  <div id="stage">
    <canvas id="view"></canvas>
    <p id="empty">Upload videos and they arrange themselves into a grid.</p>
  </div>
  <div id="bar" hidden><i></i><span></span><button id="cancel">Cancel</button></div>
  <footer>
    <button id="play">Play</button>
    <button id="restart">Restart</button>
    <label class="vol">Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="1"></label>
    <span id="time">0:00 / 0:00</span>
    <button id="fs">Fullscreen</button>
    <button id="export">EXPORT VIDEO</button>
  </footer>
</main>

<aside id="right">
  <section>
    <h3>Grid</h3>
    <label class="row"><span>Automatic layout</span><input id="auto" type="checkbox" checked></label>
    <label class="row"><span>Columns</span><input id="cols" type="number" min="1" max="100" value="1"></label>
    <label class="row"><span>Rows</span><input id="rows" type="number" min="1" max="100" value="1"></label>
    <label class="row"><span>Gap <output id="gapOut">8</output> px</span><input id="gap" type="range" min="0" max="60" value="8"></label>
    <label class="row"><span>Background</span><input id="bg" type="color" value="#000000"></label>
    <label class="row"><span>Video fit</span>
      <select id="fit"><option value="crop">Crop / Fill</option><option value="fit">Fit</option><option value="stretch">Stretch</option></select></label>
  </section>
  <section>
    <h3>Output</h3>
    <label class="row"><span>Resolution</span>
      <select id="res">
        <option value="1280x720">1280 × 720</option>
        <option value="1920x1080" selected>1920 × 1080</option>
        <option value="2560x1440">2560 × 1440</option>
        <option value="3840x2160">3840 × 2160</option>
      </select></label>
  </section>
  <section>
    <h3>Duration</h3>
    <label class="row"><span>Length</span>
      <select id="dmode"><option value="longest">Longest video</option><option value="shortest">Shortest video</option><option value="custom">Custom</option></select></label>
    <label class="row" id="customRow" hidden><span>Seconds</span><input id="custom" type="number" min="1" value="30"></label>
    <p class="info" id="durInfo">Final length: 0:00</p>
    <p class="info" id="gridInfo"></p>
    <p class="info warn" id="warn" hidden></p>
  </section>
</aside>
<input id="replace" type="file" accept="video/*" hidden>
<script src="script.js"></script>
</body>
</html>
